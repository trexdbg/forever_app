name: GEO and SEO static audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/audit-site.mjs'
      - 'scripts/check-seo-gsc-pages.mjs'
      - 'tests/seo-rare-intent-20261023.test.mjs'
      - 'assets/rares.js'
      - 'assets/rares.css'
      - 'rare/index.html'
      - 'en/rare/index.html'
      - 'tests/rare-exact-permalinks-20261125.test.mjs'
      - 'tests/dalaran-shade-community-loot-20261117.test.mjs'
      - 'tests/seo-forever-postlaunch-20261117.test.mjs'
      - 'guides/lancement-wow-forever/index.html'
      - 'en/guides/wow-forever-launch/index.html'
      - 'guides/index.html'
      - 'en/guides/index.html'
      - 'sitemap.xml'
      - 'tests/analytics-legacy-20261117.test.mjs'
      - 'assets/common.js'
      - 'tests/analytics-bis-interactions-20261124.test.mjs'
      - 'tests/analytics-rare-dungeon-interactions-20261125.test.mjs'
      - 'tests/trainer-favorites-20261117.test.mjs'
      - 'tests/trainer-reset-share-20261124.test.mjs'
      - 'assets/analytics.js'
      - 'assets/legacy.js'
      - 'assets/talents.js'
      - 'talents/*/index.html'
      - 'en/talents/*/index.html'
      - 'tests/seo-post-launch-quest-20261117.test.mjs'
      - 'quetes/index.html'
      - 'en/quetes/index.html'
      - 'assets/quests.js'
      - 'assets/quest-sidebar.css'
      - 'tests/classic-quest-step-share-20261124.test.mjs'
      - 'tests/seo-quest-tube-intent-20261124.test.mjs'
      - 'en/guides/quest-rewards-the-wrath-of-rath-mael/index.html'
      - 'guides/recompenses-quete-the-wrath-of-rath-mael/index.html'
      - 'tests/seo-trainer-intent-20261117.test.mjs'
      - 'tests/weapon-master-fast-answers-20261125.test.mjs'
      - 'assets/npcs.js'
      - 'assets/trainer-quick.css'
      - 'metiers/index.html'
      - 'en/metiers/index.html'
      - 'guides/maitres-armes/index.html'
      - 'en/guides/weapon-masters/index.html'
      - 'tests/seo-ghostfang-source-review-20261023.test.mjs'
      - 'tests/seo-favor-vendor-factions-20261023.test.mjs'
      - 'tests/seo-bronze-tube-quest-20261023.test.mjs'
      - 'data/crafting-chains-beta.json'
      - 'tests/fizzlefuse-catalogue-geo-20261023.test.mjs'
      - 'guides/marchand-fizzlefuse/index.html'
      - 'en/guides/vendor-fizzlefuse/index.html'
      - 'guides/objet-forever-264203/index.html'
      - 'en/guides/forever-item-264203/index.html'
      - 'guides/marchands-recettes-forever/index.html'
      - 'en/guides/forever-recipe-vendors/index.html'
      - 'guides/rares-dun-morogh/index.html'
      - 'en/guides/dun-morogh-rares/index.html'
      - 'guides/rare-5831/index.html'
      - 'en/guides/rare-5831/index.html'
      - 'guides/rare-5828/index.html'
      - 'en/guides/rare-5828/index.html'
      - 'guides/rares-tarides/index.html'
      - 'en/guides/barrens-rares/index.html'
      - 'guides/temps-repop-monstres-rares/index.html'
      - 'en/guides/rare-respawn-times/index.html'
      - 'tests/seo-dungeon-boss-trust-guides-20261016.test.mjs'
      - 'guides/cite-dalaran-boss-loot/index.html'
      - 'en/guides/city-of-dalaran-boss-loot/index.html'
      - 'guides/ruines-lordaeron-boss-loot/index.html'
      - 'en/guides/ruins-of-lordaeron-boss-loot/index.html'
      - 'donjons/index.html'
      - 'en/donjons/index.html'
      - 'assets/dungeons.css'
      - 'tests/dungeon-quick-maps-20261124.test.mjs'
      - 'assets/dungeons.js'
      - 'tests/dungeon-boss-share-20261125.test.mjs'
      - 'guides/salle-des-thanes-boss-loot/index.html'
      - 'en/guides/hall-of-thanes-boss-loot/index.html'
      - 'guides/excavations-paluns-boss-loot/index.html'
      - 'en/guides/wetlands-excavation-boss-loot/index.html'
      - '.github/workflows/site-geo-audit.yml'
      - 'guides/boss-forever-city-of-dalaran-*/index.html'
      - 'en/guides/forever-boss-city-of-dalaran-*/index.html'
      - 'guides/tube-en-bronze/index.html'
      - 'en/guides/bronze-tube/index.html'
      - 'guides/bis-forever-niveau-30/index.html'
      - 'en/guides/forever-level-30-bis-gear/index.html'
  push:
    paths:
      - 'scripts/audit-site.mjs'
      - '.github/workflows/site-geo-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Audit every HTML page, the sitemap, locale alternates and local links
        run: |
          node scripts/audit-site.mjs --json > geo-audit.json
          node scripts/audit-site.mjs --strict
          node scripts/check-seo-gsc-pages.mjs
          node --test tests/seo-rare-intent-20261023.test.mjs
          node --check assets/rares.js
          node --test tests/rare-exact-permalinks-20261125.test.mjs
          node --test tests/dalaran-shade-community-loot-20261117.test.mjs
          node --test tests/seo-forever-postlaunch-20261117.test.mjs
          node --test tests/analytics-legacy-20261117.test.mjs
          node --test tests/analytics-bis-interactions-20261124.test.mjs
          node --test tests/analytics-rare-dungeon-interactions-20261125.test.mjs
          node --test tests/trainer-favorites-20261117.test.mjs
          node --test tests/trainer-reset-share-20261124.test.mjs
          node --check assets/npcs.js
          node --check assets/legacy.js
          node --test tests/seo-post-launch-quest-20261117.test.mjs
          node --check assets/quests.js
          node --test tests/classic-quest-step-share-20261124.test.mjs
          node --test tests/seo-quest-tube-intent-20261124.test.mjs
          node --test tests/seo-trainer-intent-20261117.test.mjs
          node --test tests/weapon-master-fast-answers-20261125.test.mjs
          node --test tests/seo-ghostfang-source-review-20261023.test.mjs

          node --test tests/fizzlefuse-catalogue-geo-20261023.test.mjs
          node --test tests/seo-favor-vendor-factions-20261023.test.mjs
          node --test tests/seo-bronze-tube-quest-20261023.test.mjs
          node --test tests/seo-dungeon-boss-trust-guides-20261016.test.mjs
          node --test tests/dungeon-quick-maps-20261124.test.mjs
          node --check assets/dungeons.js
          node --test tests/dungeon-boss-share-20261125.test.mjs
      - name: Retain report for five days
        uses: actions/upload-artifact@v4
        with:
          name: geo-audit
          path: geo-audit.json
          retention-days: 5
