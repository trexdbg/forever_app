name: GEO and SEO static audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/audit-site.mjs'
      - 'scripts/check-seo-gsc-pages.mjs'
      - 'tests/seo-rare-intent-20261023.test.mjs'
      - 'tests/seo-ghostfang-source-review-20261023.test.mjs'
      - 'tests/seo-favor-vendor-factions-20261023.test.mjs'
      - 'tests/fizzlefuse-catalogue-geo-20261023.test.mjs'
      - 'guides/marchand-fizzlefuse/index.html'
      - 'en/guides/vendor-fizzlefuse/index.html'
      - 'guides/objet-forever-264203/index.html'
      - 'en/guides/forever-item-264203/index.html'
      - 'guides/marchands-recettes-forever/index.html'
      - 'en/guides/forever-recipe-vendors/index.html'
      - 'guides/rares-dun-morogh/index.html'
      - 'en/guides/dun-morogh-rares/index.html'
      - 'guides/rare-5831/index.html'
      - 'en/guides/rare-5831/index.html'
      - 'guides/rare-5828/index.html'
      - 'en/guides/rare-5828/index.html'
      - 'guides/rares-tarides/index.html'
      - 'en/guides/barrens-rares/index.html'
      - 'guides/temps-repop-monstres-rares/index.html'
      - 'en/guides/rare-respawn-times/index.html'
      - 'tests/seo-dungeon-boss-trust-guides-20261016.test.mjs'
      - 'guides/cite-dalaran-boss-loot/index.html'
      - 'en/guides/city-of-dalaran-boss-loot/index.html'
      - 'guides/ruines-lordaeron-boss-loot/index.html'
      - 'en/guides/ruins-of-lordaeron-boss-loot/index.html'
      - 'guides/salle-des-thanes-boss-loot/index.html'
      - 'en/guides/hall-of-thanes-boss-loot/index.html'
      - 'guides/excavations-paluns-boss-loot/index.html'
      - 'en/guides/wetlands-excavation-boss-loot/index.html'
      - '.github/workflows/site-geo-audit.yml'
      - 'guides/boss-forever-city-of-dalaran-*/index.html'
      - 'en/guides/forever-boss-city-of-dalaran-*/index.html'
      - 'guides/tube-en-bronze/index.html'
      - 'en/guides/bronze-tube/index.html'
      - 'guides/bis-forever-niveau-30/index.html'
      - 'en/guides/forever-level-30-bis-gear/index.html'
  push:
    paths:
      - 'scripts/audit-site.mjs'
      - '.github/workflows/site-geo-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Audit every HTML page, the sitemap, locale alternates and local links
        run: |
          node scripts/audit-site.mjs --json > geo-audit.json
          node scripts/audit-site.mjs --strict
          node scripts/check-seo-gsc-pages.mjs
          node --test tests/seo-rare-intent-20261023.test.mjs
          node --test tests/seo-ghostfang-source-review-20261023.test.mjs

          node --test tests/fizzlefuse-catalogue-geo-20261023.test.mjs          node --test tests/seo-favor-vendor-factions-20261023.test.mjs
          node --test tests/seo-dungeon-boss-trust-guides-20261016.test.mjs
      - name: Retain report for five days
        uses: actions/upload-artifact@v4
        with:
          name: geo-audit
          path: geo-audit.json
          retention-days: 5
