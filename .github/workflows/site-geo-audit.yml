name: GEO and SEO static audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit-site.mjs'
      - '.github/workflows/site-geo-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Audit every HTML page, the sitemap, locale alternates and local links
        run: |
          node scripts/audit-site.mjs --json > geo-audit.json
          node scripts/audit-site.mjs
      - name: Retain report for five days
        uses: actions/upload-artifact@v4
        with:
          name: geo-audit
          path: geo-audit.json
          retention-days: 5
