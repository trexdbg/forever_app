name: Data reliability (offline PR gate)
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'docs/data-quality.md'
      - 'scripts/check-data-quality.mjs'
      - 'tests/data-quality.test.mjs'
      - '.github/workflows/data-quality.yml'
      - 'data/**'
      - 'assets/rares.js'
      - 'assets/rares.css'
      - 'rare/index.html'
      - 'en/rare/index.html'
      - 'tests/rare-ui-point-evidence-20261016.test.mjs'
      - 'assets/dungeons.js'
      - 'scripts/build-item-acquisition-index.mjs'
      - 'tests/item-acquisition-index.test.mjs'
      - 'tests/dungeon-boss-loot-provenance-20261016.test.mjs'
      - 'scripts/validate-rare-locations.mjs'
      - 'tests/rare-locations.test.mjs'
      - 'tests/rare-forever-loot-wave1.test.mjs'
      - 'tests/rare-forever-loot-wave3.test.mjs'
      - 'tests/rare-forever-quest-items-wave4.test.mjs'
      - 'tests/rare-classic-fr-localization-20261016.test.mjs'
      - 'tests/rare-forever-gear-wave5-20261016.test.mjs'
      - 'tests/rare-classic-fallback-forever-item-stats-20261016.test.mjs'
      - 'tests/rare-forever-new-wave2.test.mjs'
      - 'scripts/check-forever-evidence.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression fixtures (no network)
        run: node --test tests/data-quality.test.mjs
      - name: Full JSON reliability scan (errors block; warnings reviewed)
        run: node scripts/check-data-quality.mjs
      - name: Rare location evidence fixtures
        run: node --test tests/rare-locations.test.mjs
      - name: Rare map per-pin bilingual provenance and selected waypoint regression
        run: node --test tests/rare-ui-point-evidence-20261016.test.mjs
      - name: Forever 1-30 notable rare loot regression
        run: node --test tests/rare-forever-loot-wave1.test.mjs
      - name: Three new Forever rare loot links and item acquisition regression
        run: node --test tests/rare-forever-loot-wave3.test.mjs
      - name: Three Forever quest-linked rare items, evidence and acquisition safeguards
        run: node --test tests/rare-forever-quest-items-wave4.test.mjs
      - name: Source-reviewed Classic French rare NPC and quest-item localization
        run: node --test tests/rare-classic-fr-localization-20261016.test.mjs
      - name: Source-reviewed Forever 1-30 gear loot, versioned stats and French provenance
        run: node --test tests/rare-forever-gear-wave5-20261016.test.mjs
      - name: Three Classic rare loot fallbacks with two separate Forever item stat snapshots
        run: node --test tests/rare-classic-fallback-forever-item-stats-20261016.test.mjs
      - name: Rare and dungeon module JavaScript syntax
        run: |
          node --check assets/rares.js
          node --check assets/dungeons.js
      - name: Dungeon boss-drop source proof and acquisition index regression
        run: node --test tests/dungeon-boss-loot-provenance-20261016.test.mjs
      - name: Deterministic acquisition index source and link tests
        run: node --test tests/item-acquisition-index.test.mjs
      - name: Cross-catalogue acquisition index is fully reproducible
        run: node scripts/build-item-acquisition-index.mjs --check
      - name: Forever new starter-zone rare discovery regression
        run: node --test tests/rare-forever-new-wave2.test.mjs
      - name: Cross-catalogue Forever source audit
        run: node scripts/check-forever-evidence.mjs
      - name: Rare location provenance gate
        run: node scripts/validate-rare-locations.mjs
