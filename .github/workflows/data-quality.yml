name: Data reliability (offline PR gate)
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'docs/data-quality.md'
      - 'scripts/check-data-quality.mjs'
      - 'tests/data-quality.test.mjs'
      - '.github/workflows/data-quality.yml'
      - 'data/**'
      - 'assets/rares.js'
      - 'scripts/validate-rare-locations.mjs'
      - 'tests/rare-locations.test.mjs'
      - 'tests/rare-forever-loot-wave1.test.mjs'
      - 'tests/rare-forever-new-wave2.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression fixtures (no network)
        run: node --test tests/data-quality.test.mjs
      - name: Full JSON reliability scan (errors block; warnings reviewed)
        run: node scripts/check-data-quality.mjs
      - name: Rare location evidence fixtures
        run: node --test tests/rare-locations.test.mjs
      - name: Forever 1-30 notable rare loot regression
        run: node --test tests/rare-forever-loot-wave1.test.mjs
      - name: Rare module JavaScript syntax
        run: node --check assets/rares.js
      - name: Forever new starter-zone rare discovery regression
        run: node --test tests/rare-forever-new-wave2.test.mjs
      - name: Rare location provenance gate
        run: node scripts/validate-rare-locations.mjs
