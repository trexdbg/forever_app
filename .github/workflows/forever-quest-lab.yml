name: Forever quest lab
on:
  pull_request:
    paths:
      - 'lab/quetes-forever/**'
      - '.github/workflows/forever-quest-lab.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test lab/quetes-forever/route-engine.test.cjs
      - run: node --check lab/quetes-forever/route.js && node --check lab/quetes-forever/locale.js
