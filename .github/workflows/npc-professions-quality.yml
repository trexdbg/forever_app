name: Agent 03 NPC and professions audit
on:
  pull_request:
    paths:
      - data/npcs.json
      - metiers/index.html
      - en/metiers/index.html
      - assets/crafting-beta.js
      - assets/crafting-beta.css
      - assets/global-search.js
      - assets/alchemy-beta.js
      - assets/alchemy-beta.css
      - data/alchemy-chains-beta.json
      - scripts/check-alchemy-beta.mjs
      - tests/alchemy-beta.test.mjs
      - tests/crafting-beta-ui.test.mjs
      - scripts/check-crafting-visual.mjs
      - docs/crafting-beta-ui-issue43.md
      - data/crafting-chains-beta.json
      - scripts/check-crafting-chains.mjs
      - tests/crafting-chains.test.mjs
      - docs/crafting-chains-audit-2026-10-13.md
      - assets/npcs.js
      - data/professions.json
      - scripts/check-npc-professions.mjs
      - scripts/check-trainer-locations.mjs
      - scripts/check-trainer-visual.mjs
      - tests/trainer-locations.test.mjs
      - docs/trainer-locations-mission07-2026-10-14.md
      - tests/npc-professions.test.mjs
      - tests/forever-vendors-wave2.test.mjs
      - tests/zephras-vayn-vendor.test.mjs
      - tests/forever-blacksmith-camp.test.mjs
      - tests/forever-resolved-vendor-plans.test.mjs
      - tests/forever-leatherworking-camps.test.mjs
      - docs/npc-professions-audit-2026-10-13.md
      - .github/workflows/npc-professions-quality.yml
permissions:
  contents: read
jobs:
  npc-professions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check scripts/check-npc-professions.mjs
          node --check scripts/check-trainer-locations.mjs
          node --check scripts/check-trainer-visual.mjs
          node --check tests/trainer-locations.test.mjs
          node --check scripts/check-crafting-chains.mjs
          node --check assets/crafting-beta.js
          node --check assets/global-search.js
          node --check assets/alchemy-beta.js
          node --check scripts/check-alchemy-beta.mjs
          node --check tests/alchemy-beta.test.mjs
          node --check tests/crafting-beta-ui.test.mjs
          node --check scripts/check-crafting-visual.mjs
          node --check tests/crafting-chains.test.mjs
          node --check assets/npcs.js
          node --check tests/npc-professions.test.mjs
      - name: Native cross-catalogue data quality
        run: node scripts/check-data-quality.mjs
      - name: Native quality regressions
        run: node --test tests/data-quality.test.mjs
      - name: Agent 03 scoped NPC and professions audit
        run: node scripts/check-npc-professions.mjs
      - name: Agent 03 regression tests
        run: node --test tests/npc-professions.test.mjs
      - name: Forever vendor recipes wave 2, per-link evidence and cross-index checks (#58)
        run: node --test tests/forever-vendors-wave2.test.mjs
      - name: Zephras Vayn Moongaze seller IDs, reputation, point and item acquisition regression
        run: node --test tests/zephras-vayn-vendor.test.mjs
      - name: Documented early Forge camp plan and 57 sales regression
        run: node --test tests/forever-blacksmith-camp.test.mjs
      - name: Two resolved Forever vendor recipe IDs and French names (#58)
        run: node --test tests/forever-resolved-vendor-plans.test.mjs
      - name: Daniel Stitchsong and Pawani — 36 Forever patterns and 72 seller links
        run: node --test tests/forever-leatherworking-camps.test.mjs
      - name: Trainer location evidence and map consistency (#51)
        run: node scripts/check-trainer-locations.mjs
      - name: Trainer location fixtures and legacy map safeguards (#51)
        run: node --test tests/trainer-locations.test.mjs
      - name: Agent 03 crafting-chain provenance and graph integrity
        run: node scripts/check-crafting-chains.mjs
      - name: Agent 03 crafting-chain fixtures
        run: node --test tests/crafting-chains.test.mjs
      - name: Agent 03 crafting beta UI smoke and language tests
        run: node --test tests/crafting-beta-ui.test.mjs
      - name: Agent 03 alchemy beta provenance and First Aid exclusions
        run: node scripts/check-alchemy-beta.mjs
      - name: Agent 03 alchemy beta interface smoke and bilingual fixtures
        run: node --test tests/alchemy-beta.test.mjs
      - name: Local Chromium FR/EN responsive screenshots and browser smoke
        run: node scripts/check-crafting-visual.mjs
      - name: Agent 03 named trainer waypoints in Chrome FR/EN desktop and mobile
        run: node scripts/check-trainer-visual.mjs
      - name: Attach visual review screenshots (no deployment)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent03-crafting-beta-browser
          path: |
            artifacts/crafting-beta-visual/*.png
            artifacts/trainer-locations/*.png
          if-no-files-found: warn
          retention-days: 7
