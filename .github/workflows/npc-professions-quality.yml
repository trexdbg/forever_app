name: Agent 03 NPC and professions audit
on:
  pull_request:
    paths:
      - data/npcs.json
      - data/professions.json
      - scripts/check-npc-professions.mjs
      - tests/npc-professions.test.mjs
      - docs/npc-professions-audit-2026-10-13.md
      - .github/workflows/npc-professions-quality.yml
permissions:
  contents: read
jobs:
  npc-professions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check scripts/check-npc-professions.mjs
          node --check tests/npc-professions.test.mjs
      - name: Native cross-catalogue data quality
        run: node scripts/check-data-quality.mjs
      - name: Native quality regressions
        run: node --test tests/data-quality.test.mjs
      - name: Agent 03 scoped NPC and professions audit
        run: node scripts/check-npc-professions.mjs
      - name: Agent 03 regression tests
        run: node --test tests/npc-professions.test.mjs
