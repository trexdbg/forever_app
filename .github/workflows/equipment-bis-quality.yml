name: Equipment and BiS offline regression
on:
  pull_request:
    paths:
      - 'assets/bis-niveaux.js'
      - 'assets/item-locale.js'
      - 'assets/equipment-rules.js'
      - 'assets/gear-data.js'
      - 'assets/items-v3.js'
      - 'data/bis*.json'
      - 'data/items*.json'
      - 'data/item-acquisition-index.json'
      - 'data/npcs.json'
      - 'data/rares.json'
      - 'data/dungeons-forever.json'
      - 'data/crafting-chains-beta.json'
      - 'data/alchemy-chains-beta.json'
      - 'scripts/build-item-acquisition-index.mjs'
      - 'tests/item-acquisition-index.test.mjs'
      - 'equipements/index.html'
      - 'en/equipements/index.html'
      - 'assets/item-catalogue.css'
      - 'scripts/check-bis-niveaux.mjs'
      - 'scripts/check-item-locales.mjs'
      - 'scripts/check-bis-behavior.mjs'
      - '.github/workflows/equipment-bis-quality.yml'
permissions:
  contents: read
jobs:
  equipment-bis:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Native Node.js checks — offline, read-only
        run: |
          node --version
          node --check assets/bis-niveaux.js
          node --check assets/item-locale.js
          node --check assets/items-v3.js
          node --check scripts/build-item-acquisition-index.mjs
          node scripts/check-bis-niveaux.mjs
          node scripts/check-item-locales.mjs
          node scripts/check-bis-behavior.mjs
          node scripts/build-item-acquisition-index.mjs --check
          node --test tests/item-acquisition-index.test.mjs
          node --test tests/rare-gear-catalogue-20261018.test.mjs
